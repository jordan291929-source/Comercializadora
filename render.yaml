# Render Blueprint: requires a paid web instance with a persistent disk.
services:
  - type: web
    name: comercializadora-viviana
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/bootstrap
    disk:
      name: comercializadora-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: COMERCIALIZADORA_DB
        value: /var/data/app.sqlite3
      - key: COMERCIALIZADORA_SECURE_COOKIE
        value: "1"
      - key: COMERCIALIZADORA_SETUP_KEY
        sync: false
